<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Color Kits — by aSian</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.svg">
    <meta name="description" content="90 curated color systems for TradingView. Key Levels, ICT/SMC, VWAP, Fibonacci and more.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { background: #05050f; color: #fff; font-family: 'Syne', sans-serif; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 2px; }
      .noscroll { overflow-x: auto; scrollbar-width: none; }
      .noscroll::-webkit-scrollbar { display: none; }
      /* GPU-accelerated animations — zero React cost */
      @keyframes spin3d { from { transform: rotateX(-22deg) rotateY(0deg); } to { transform: rotateX(-22deg) rotateY(360deg); } }
      @keyframes floatY { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulseGlow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .cube-wrap { animation: floatY 6s ease-in-out infinite; }
      .cube-inner { animation: spin3d 9s linear infinite; transform-style: preserve-3d; }
      .fade-up { animation: fadeUp 0.4s ease forwards; }
      .glow-pulse { animation: pulseGlow 2.5s ease-in-out infinite; }
      /* CSS-only hover for kit cards — no JS */
      .kit-card { transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s ease; }
      .kit-card:hover { transform: translateY(-4px) scale(1.03); }
      .kit-card.active { transform: translateY(-6px) scale(1.05) !important; }
      /* Mobile responsive */
      @media (max-width: 768px) {
        .hero-grid { grid-template-columns: 1fr !important; }
        .detail-grid { grid-template-columns: 1fr !important; }
        .nav-inner { padding: 0 20px !important; }
        .main-pad { padding-left: 20px !important; padding-right: 20px !important; }
        .hide-mobile { display: none !important; }
        .hero-h1 { font-size: 52px !important; }
        .sticky-card { position: relative !important; top: 0 !important; }
      }
      @media (max-width: 480px) {
        .hero-h1 { font-size: 40px !important; }
      }

      /* Shimmer glass effect */
      @keyframes shimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      /* Force all shimmer elements to sync by anchoring to page load time */
      :root { --shimmer-start: 0s; }
      .glass-shimmer {
        position: relative; overflow: hidden;
      }
      .glass-shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
        background-size: 200% 100%;
        animation: shimmer 8s ease-in-out infinite;
        animation-delay: 0s;
        pointer-events: none;
        border-radius: inherit;
      }
      /* Smooth color transitions */
      .color-transition { transition: background-color 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease !important; }
      /* Kit card slide-in */
      @keyframes kitSlideIn { from { opacity:0; transform:translateY(12px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
      .kit-slide { animation: kitSlideIn 0.28s cubic-bezier(0.34,1.3,0.64,1) forwards; }
      /* Copy micro-animation */
      @keyframes copyPop { 0%{transform:scale(1)} 30%{transform:scale(1.08)} 60%{transform:scale(0.97)} 100%{transform:scale(1)} }
      .copy-pop { animation: copyPop 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
      /* Mobile */
      @media (max-width: 900px) {
        .detail-grid { grid-template-columns: 1fr !important; }
        .hero-grid { grid-template-columns: 1fr !important; }
        .kit-grid { grid-template-columns: repeat(2, 1fr) !important; }
        .nav-inner { padding: 0 16px !important; gap: 8px !important; }
        .main-pad { padding-left: 16px !important; padding-right: 16px !important; }
        .hide-mobile { display: none !important; }
        .sticky-card { position: relative !important; top: 0 !important; }
        .hero-h1 { font-size: 44px !important; }
        .section-tabs { flex-wrap: wrap !important; }
      }
      /* Swipe hint on mobile */
      @media (max-width: 900px) {
        .swipe-hint { display: flex !important; }
      }
      .swipe-hint { display: none; }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
