<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Color Kits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { background: #05050f; color: #fff; font-family: 'Syne', sans-serif; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
      .noscroll { overflow-x: auto; scrollbar-width: none; }
      .noscroll::-webkit-scrollbar { display: none; }
      @keyframes float { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-12px)} }
      @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
      @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
      @keyframes spin3d { from{transform:rotateX(-15deg) rotateY(0deg)} to{transform:rotateX(-15deg) rotateY(360deg)} }
      @keyframes scanline { 0%{top:-20%} 100%{top:120%} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
