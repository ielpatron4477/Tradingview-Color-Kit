<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#05050f"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="100%" stop-color="#b8880a"/>
    </linearGradient>
    <radialGradient id="gateGlow" cx="73%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#c8a030" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8a030" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- grid -->
  <line x1="0" y1="78" x2="1200" y2="78" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="552" x2="1200" y2="552" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Gate glow -->
  <rect x="600" y="0" width="600" height="630" fill="url(#gateGlow)"/>
  <!-- Torii gate -->
  <rect x="720" y="68" width="420" height="40" rx="10" fill="url(#goldg)" opacity="0.9"/>
  <rect x="698" y="46" width="464" height="34" rx="12" fill="#b8880a" opacity="0.8"/>
  <rect x="706" y="50" width="448" height="28" rx="10" fill="url(#goldg)"/>
  <rect x="764" y="116" width="332" height="28" rx="7" fill="url(#goldg)" opacity="0.7"/>
  <rect x="730" y="88" width="38" height="490" rx="10" fill="url(#goldg)" opacity="0.85"/>
  <rect x="1092" y="88" width="38" height="490" rx="10" fill="url(#goldg)" opacity="0.85"/>
  <!-- Trend line -->
  <polyline points="740,560 820,440 900,490 980,330 1060,200 1120,130"
