  <circle cx="1120" cy="130" r="10" fill="#f06060" opacity="0.9"/>
  <circle cx="1120" cy="130" r="5" fill="#ff9090"/>
  <!-- Text -->
  <text x="60" y="100" fill="#c8a030" font-size="13" font-family="monospace" opacity="0.7">✦ THE DEFINITIVE TRADINGVIEW COLOR REFERENCE</text>
  <text x="60" y="210" fill="#f0ece6" font-size="100" font-family="Georgia,serif" font-weight="bold">Chart</text>
  <text x="60" y="320" fill="#c8a030" font-size="100" font-family="Georgia,serif" font-weight="bold">Color</text>
  <text x="60" y="430" fill="#f0ece6" font-size="100" font-family="Georgia,serif" font-weight="bold">Kits</text>
  <text x="60" y="480" fill="rgba(160,150,130,0.8)" font-size="18" font-family="sans-serif">125 curated color systems for TradingView</text>
  <circle cx="68" cy="508" r="8" fill="#c8a030"/>
  <text x="84" y="514" fill="rgba(160,150,130,0.6)" font-size="12" font-family="monospace">OPENS</text>
  <circle cx="168" cy="508" r="8" fill="#e04040"/>
  <text x="184" y="514" fill="rgba(160,150,130,0.6)" font-size="12" font-family="monospace">HIGHS</text>
  <circle cx="268" cy="508" r="8" fill="#38c870"/>
  <text x="284" y="514" fill="rgba(160,150,130,0.6)" font-size="12" font-family="monospace">LOWS</text>
  <circle cx="358" cy="508" r="8" fill="#7838c8"/>
  <text x="374" y="514" fill="rgba(160,150,130,0.6)" font-size="12" font-family="monospace">MIDS</text>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="rgba(200,168,48,0.1)" stroke-width="1"/>
  <text x="60" y="622" fill="rgba(255,255,255,0.2)" font-size="13" font-family="monospace" font-weight="bold">tvkits.xyz</text>
  <text x="1040" y="622" fill="rgba(255,255,255,0.15)" font-size="13" font-family="monospace">by aSian</text>
