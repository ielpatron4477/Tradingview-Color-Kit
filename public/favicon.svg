<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0818"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="100%" stop-color="#c8900a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a030" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c8a030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e04040" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e04040" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Subtle glow behind yin yang -->
  <circle cx="16" cy="15" r="11" fill="url(#glow1)"/>

  <!-- Torii gate outline — Japanese arch, minimalist -->
  <!-- Top beam -->
  <rect x="4" y="7" width="24" height="2.5" rx="1.2" fill="url(#goldg)" opacity="0.9"/>
  <!-- Second beam -->
  <rect x="7" y="11" width="18" height="2" rx="1" fill="url(#goldg)" opacity="0.7"/>
  <!-- Left pillar -->
  <rect x="7.5" y="7" width="2.5" height="18" rx="1.2" fill="url(#goldg)" opacity="0.85"/>
  <!-- Right pillar -->
  <rect x="22" y="7" width="2.5" height="18" rx="1.2" fill="url(#goldg)" opacity="0.85"/>

  <!-- Chart line through the gate — rising trend -->
  <polyline points="9,24 13,20 17,21.5 21,16 23,13"
    fill="none" stroke="#e04040" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Tiny dot at tip of trend line — signal -->
  <circle cx="23" cy="13" r="1.4" fill="#f06060"/>

  <!-- Subtle ground line -->
  <line x1="5" y1="27" x2="27" y2="27" stroke="rgba(200,160,48,0.25)" stroke-width="0.8"/>
</svg>
